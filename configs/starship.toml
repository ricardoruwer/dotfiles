add_newline = true

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_metrics\
$jobs\
$status
$character"""

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

[git_branch]
format = '[$symbol$branch]($style) '

[git_metrics]
disabled = false

[status]
disabled = false
