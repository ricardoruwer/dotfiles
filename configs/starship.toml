"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

right_format = "$git_metrics"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$jobs\
$status\
$fill
$character"""

[character]
success_symbol = '[➜](bold green)'
error_symbol = '[➜](bold red)'

[git_branch]
format = '[$symbol$branch]($style) '

[git_metrics]
disabled = false

[status]
disabled = false

[fill]
symbol = '-'
style = 'black'
